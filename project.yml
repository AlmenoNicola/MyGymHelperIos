# Riserva: se MyGymHelper.xcodeproj non si apre, rigeneralo con XcodeGen (brew install xcodegen; xcodegen generate).
name: MyGymHelper
options:
  bundleIdPrefix: app.mygymhelper
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
packages:
  MyGymHelperCore:
    path: Core
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.20.0
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    majorVersion: 5.0.1
targets:
  MyGymHelper:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MyGymHelperCore
      - package: Supabase
        product: Supabase
      - package: SpotifyiOS
        product: SpotifyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mygymhelper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MyGymHelper
        CODE_SIGN_ENTITLEMENTS: Support/MyGymHelper.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMotionUsageDescription: "MyGymHelper uses the motion sensors to count your reps while you train."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MyGymHelper reads your weight and height from Health to fill in your profile, only when you ask."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MyGymHelper saves your strength workouts to Health if you turn on the connection."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    scheme:
      storeKitConfiguration: Support/MyGymHelper.storekit
